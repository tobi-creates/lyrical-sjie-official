Set-Content -Path "admin.html" -Value @"
<!DOCTYPE html>
<html>
<head>
<title>Admin - Lyrical Sjie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Inter,sans-serif;background:#0a0605;color:#f5e9d4;margin:0;padding:20px}
h1{color:#d4af37} .tabs{display:flex;gap:10px;margin:20px 0}
.tab{padding:10px 20px;background:#1a1210;border:1px solid #d4af37;cursor:pointer;color:#d4af37}
.tab.active{background:linear-gradient(135deg,#b76e2a,#d4af37);color:#000}
.card{background:#141010;border:1px solid rgba(212,175,55,.2);padding:15px;margin:10px 0;border-radius:10px}
small{color:#8a7a60}
#login{max-width:320px;margin:100px auto;text-align:center}
input{width:100%;padding:12px;margin:8px 0;background:#000;border:1px solid #d4af37;color:#fff;border-radius:8px}
button{width:100%;padding:12px;background:linear-gradient(135deg,#b76e2a,#d4af37);border:none;font-weight:800;cursor:pointer;border-radius:8px}
</style>
</head>
<body>
<div id="login">
<h1>ADMIN ACCESS</h1>
<input id="pass" type="password" placeholder="Enter admin password">
<button onclick="unlock()">Unlock</button>
<p id="err" style="color:#ff4444"></p>
</div>

<div id="panel" style="display:none">
<h1>Lyrical Sjie — Admin</h1>
<div class="tabs"><div class="tab active" onclick="load('bookings')">Bookings</div><div class="tab" onclick="load('messages')">Messages</div></div>
<div id="data">Loading...</div>
</div>

<script>
const ADMIN_PASS = "Lyrical2025!";
function unlock(){
 if(document.getElementById('pass').value===ADMIN_PASS){
   document.getElementById('login').style.display='none';
   document.getElementById('panel').style.display='block';
   load('bookings');
 } else { document.getElementById('err').innerText='Wrong password'; }
}
async function load(type){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>{ if(t.textContent.toLowerCase()===type) t.classList.add('active') });
 const res = await fetch('/api/'+type);
 const json = await res.json();
 if(!json.length){ document.getElementById('data').innerHTML='<p>No '+type+' yet</p>'; return; }
 document.getElementById('data').innerHTML = json.reverse().map(i=>`
   <div class="card">
     <strong>${i.name || i.clientName || 'Unknown'}</strong> <small>${new Date(i.createdAt).toLocaleString()}</small><br>
     ${i.email ? '📧 '+i.email+'<br>':''}
     ${i.message ? '<p>'+i.message+'</p>':''}
     ${i.eventType ? 'Event: '+i.eventType+'<br>':''}
     ${i.date ? 'Date: '+i.date+'<br>':''}
   </div>
 `).join('');
}
</script>
</body>
</html>
"@ -Encoding utf8
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
