<!DOCTYPE html>
<html>
<head>
<title>Admin — Lyrical Sjie | 7455</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Space+Grotesk&display=swap" rel="stylesheet">
<style>body{font-family:'Space Grotesk'}h1{font-family:'Syne'}</style>
</head>
<body class="bg-black text-white min-h-screen p-6 md:p-10">
<div class="max-w-7xl mx-auto">
<h1 class="text-5xl font-black mb-2">ADMIN <span class="text-zinc-600">7455</span></h1>
<p id="status" class="text-zinc-500 mb-10">Checking DB...</p>

<div class="grid md:grid-cols-2 gap-10">
<div>
<h2 class="text-2xl font-bold mb-4">Messages <span id="msgCount" class="text-zinc-600"></span></h2>
<div id="messages" class="space-y-4"></div>
</div>
<div>
<h2 class="text-2xl font-bold mb-4">Bookings <span id="bookCount" class="text-zinc-600"></span></h2>
<div id="bookings" class="space-y-4"></div>
</div>
</div>

<div class="mt-20 flex gap-4">
<a href="/" class="border border-white/20 px-6 py-3 rounded-full hover:bg-white hover:text-black transition">← Back Home</a>
<button onclick="loadAll()" class="bg-white text-black px-6 py-3 rounded-full font-bold">Refresh</button>
</div>
</div>

<script>
async function loadAll(){
  const health = await fetch('/api/health').then(r=>r.json());
  document.getElementById('status').innerHTML = health.connected? '✅ Connected to <b>lyricalsjiedb</b> — 7455 LIVE' : '❌ DB Down';
  const [msgs, books] = await Promise.all([
    fetch('/api/messages').then(r=>r.json()),
    fetch('/api/bookings').then(r=>r.json())
  ]);
  document.getElementById('msgCount').innerText = `(${msgs.length})`;
  document.getElementById('bookCount').innerText = `(${books.length})`;
  document.getElementById('messages').innerHTML = msgs.map(m=>`
    <div class="bg-zinc-900 border border-white/10 p-5 rounded-2xl">
      <div class="flex justify-between"><b>${m.name}</b><span class="text-xs text-zinc-500">${new Date(m.createdAt).toLocaleString()}</span></div>
      <div class="text-sm text-zinc-400">${m.email}</div>
      <p class="mt-3 text-zinc-200">${m.message}</p>
      <div class="mt-4 flex gap-2">
        <a href="https://wa.me/?text=Hi ${m.name}, saw your message on Lyrical Sjie site" target="_blank" class="text-xs bg-green-500 text-black px-3 py-1 rounded-full font-bold">WhatsApp</a>
        <a href="mailto:${m.email}" class="text-xs border border-white/20 px-3 py-1 rounded-full">Email</a>
        <button onclick="del('messages','${m._id}')" class="text-xs text-red-400 ml-auto">Delete</button>
      </div>
    </div>`).join('') || '<p class="text-zinc-600">No messages yet</p>';
  document.getElementById('bookings').innerHTML = books.map(b=>`
    <div class="bg-zinc-900 border border-yellow-500/20 p-5 rounded-2xl">
      <div class="flex justify-between"><b>${b.name} — ${b.eventType}</b><span class="text-xs text-zinc-500">${b.date||''}</span></div>
      <div class="text-sm text-zinc-400">${b.email}</div>
      <p class="mt-3 text-zinc-200">${b.message}</p>
      <div class="mt-4 flex gap-2">
        <a href="https://wa.me/27${b.email.includes('@')?'':''}?text=Hi ${b.name}, booking for ${b.eventType} on ${b.date} confirmed 7455!" target="_blank" class="text-xs bg-white text-black px-3 py-1 rounded-full font-bold">Confirm Booking</a>
        <a href="mailto:${b.email}?subject=Booking Confirmed - Lyrical Sjie 7455&body=Hi ${b.name}, your ${b.eventType} on ${b.date} is confirmed!" class="text-xs border border-white/20 px-3 py-1 rounded-full">Email</a>
        <button onclick="del('bookings','${b._id}')" class="text-xs text-red-400 ml-auto">Delete</button>
      </div>
    </div>`).join('') || '<p class="text-zinc-600">No bookings yet</p>';
}
async function del(type,id){
  if(!confirm('Delete this?')) return;
  await fetch(`/api/${type}?id=${id}`,{method:'DELETE'});
  loadAll();
}
loadAll();
</script>
</body>
</html>
